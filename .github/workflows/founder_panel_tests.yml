name: Painel Founder — testes

on:
  push:
    paths:
      - "dashboard/**"
      - "config/notion_ids.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/founder_panel_tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rodar testes (sem Notion write / sem n8n)
        env:
          CONFIRM: "0"
          N8N_AVANCAR_ENABLED: "0"
        run: python -m pytest tests/ -q
